spring:
  application:
    name: eureka-server

server:
  port: 8761

# Single-node Eureka: this instance is the registry; it does not register
# itself or fetch peer state from others.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Faster eviction in dev so disappeared services drop quickly
    eviction-interval-timer-in-ms: 15000
    enable-self-preservation: false
