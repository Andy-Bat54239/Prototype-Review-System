spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # OtpEmailSender is the inline fallback used when notification-service is
  # unreachable. Spring auto-configures the JavaMailSender bean only when
  # spring.mail.host is set — without this, the bean is missing and context
  # initialization fails ("required a bean of type JavaMailSender").
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

mail:
  from: ${MAIL_FROM:noreply@auca.ac.rw}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  # Must be the SAME secret across every service so each can validate the others' tokens.
  secret: ${JWT_SECRET:dev-only-fallback-secret-do-not-use-in-production-min-32}

# user-service is the source of truth for user records — auth-service calls it
# to resolve email → user and check status.
user-service:
  base-url: ${USER_SERVICE_URL:http://user-service}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USER:prbs}
    password: ${DB_PASSWORD:prbs}
    driver-class-name: org.postgresql.Driver
