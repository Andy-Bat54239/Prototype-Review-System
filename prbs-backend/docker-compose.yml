# One-command local dev for the modular monolith.
# Run:  docker compose up --build
#
# Backend (API):    http://localhost:8080
# Swagger UI:       http://localhost:8080/swagger-ui.html
# Mailpit web UI:   http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI + REST

  prbs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-dev-only-fallback-secret-do-not-use-in-production-min-32}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      - mailpit
