# One-command local dev for the microservices stack.
# Run:  docker compose up --build
#
# Eureka dashboard:     http://localhost:8761
# Mailpit web UI:       http://localhost:8025
# Gateway (public API): http://localhost:8080
#
# Swagger UIs (one per service, direct-to-port):
#   http://localhost:8081/swagger-ui.html   auth-service
#   http://localhost:8082/swagger-ui.html   user-service
#   http://localhost:8083/swagger-ui.html   booking-service
#   http://localhost:8085/swagger-ui.html   notification-service
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI + REST

  eureka:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8082:8082"   # exposed so http://localhost:8082/swagger-ui.html is reachable
    depends_on:
      - eureka

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8081:8081"
    depends_on:
      - eureka
      - user-service
      - mailpit

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      - eureka

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8085:8085"
    depends_on:
      - eureka
      - mailpit
