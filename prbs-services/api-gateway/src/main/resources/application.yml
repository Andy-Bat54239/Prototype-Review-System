spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Route paths to logical service names; Eureka resolves them to instances.
      # lb:// triggers the Spring Cloud LoadBalancer in front of Eureka.
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        - id: user-service-settings
          uri: lb://user-service
          predicates:
            - Path=/api/v1/settings/**

        - id: user-service-me
          uri: lb://user-service
          predicates:
            - Path=/api/v1/me

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**

        - id: availability-via-booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/availability/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, Accept]
            allowCredentials: true
            maxAge: 3600

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
