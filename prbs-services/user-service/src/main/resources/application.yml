spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:user;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  # Must match across all services so each can validate JWTs minted by auth-service.
  secret: ${JWT_SECRET:dev-only-fallback-secret-do-not-use-in-production-min-32}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USER:prbs}
    password: ${DB_PASSWORD:prbs}
    driver-class-name: org.postgresql.Driver
