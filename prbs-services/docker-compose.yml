# One-command local dev for the microservices stack.
# Run:  docker-compose up --build
#
# Mailpit web UI: http://localhost:8025
# Eureka dashboard: http://localhost:8761
# Gateway: http://localhost:8080 (this is what the frontend talks to)
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI + REST

  eureka:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - eureka

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      - eureka

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - eureka
      - user-service
      - mailpit

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
    depends_on:
      - eureka

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - eureka
      - mailpit

# Dockerfiles are not yet written — that lands with Step 1 of MIGRATION.md when
# we also add the Postgres backing store. For now, run services directly with
# `mvn spring-boot:run` from each module.
