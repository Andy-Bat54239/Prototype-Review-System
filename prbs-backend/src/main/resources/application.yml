spring:
  application:
    name: prbs-backend
  datasource:
    url: jdbc:h2:mem:prbs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

jwt:
  secret: ${JWT_SECRET:dev-only-fallback-secret-do-not-use-in-production-min-32}

mail:
  from: ${MAIL_FROM:noreply@auca.ac.rw}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prbs}
    username: ${DB_USER:prbs}
    password: ${DB_PASSWORD:prbs}
    driver-class-name: org.postgresql.Driver
